name: Publish

on:
  push:
    tags: ['v*', '[0-9]+.*']

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test Source/Encore.Tests/Encore.Tests.csproj -c Release

      - name: Pack
        run: dotnet pack Source/Encore/Encore.csproj -c Release -o out -p:Version=${GITHUB_REF_NAME#v} -p:ContinuousIntegrationBuild=true

      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        run: dotnet nuget push "out/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json

      - name: Draft Release
        run: gh release create "$GITHUB_REF_NAME" out/*.nupkg --draft --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
